name: build
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
jobs:
  build:
    strategy: { matrix: { os: [windows-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - name: model
        shell: bash
        run: curl -sSL -o rvm_mobilenetv3_fp32.onnx https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip && cp ffmpeg-*/bin/ffmpeg.exe ffmpeg-*/bin/ffprobe.exe .
      - name: ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg && cp $(which ffmpeg) $(which ffprobe) .
      - name: pyinstaller
        shell: bash
        run: |
          SEP=$([ "$RUNNER_OS" = "Windows" ] && echo ";" || echo ":")
          EXT=$([ "$RUNNER_OS" = "Windows" ] && echo ".exe" || echo "")
          pyinstaller --noconfirm --onedir --name ultra-matte \
            --add-data "rvm_mobilenetv3_fp32.onnx${SEP}." --add-binary "ffmpeg${EXT}${SEP}." --add-binary "ffprobe${EXT}${SEP}." matte.py
      - name: zip
        shell: bash
        run: |
          cd dist && if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../ultra-matte-win.zip ultra-matte; else zip -qr ../ultra-matte-mac.zip ultra-matte; fi
      - uses: actions/upload-artifact@v4
        with: { name: ultra-matte-${{ runner.os }}, path: 'ultra-matte-*.zip' }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: 'ultra-matte-*.zip' }
