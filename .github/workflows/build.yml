name: build
on:
  push:
    branches: [main]
    paths: ['matte.py', 'requirements.txt', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, zip: ultra-matte-win.zip }
          - { os: macos-latest, zip: ultra-matte-mac-arm64.zip }
          - { os: macos-13, zip: ultra-matte-mac-x64.zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install
        run: pip install -r requirements.txt

      - name: model
        shell: bash
        run: curl -sSL -o rvm_mobilenetv3_fp32.onnx https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip
          cp ffmpeg-*/bin/ffmpeg.exe ffmpeg-*/bin/ffprobe.exe .

      - name: ffmpeg (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" "$(which ffprobe)" .

      - name: pyinstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; EXT=".exe"; else SEP=":"; EXT=""; fi
          pyinstaller --noconfirm --onedir --name ultra-matte \
            --add-data "rvm_mobilenetv3_fp32.onnx${SEP}." \
            --add-binary "ffmpeg${EXT}${SEP}." --add-binary "ffprobe${EXT}${SEP}." matte.py

      - name: smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then FF=./ffmpeg.exe; BIN=dist/ultra-matte/ultra-matte.exe; else FF=./ffmpeg; BIN=dist/ultra-matte/ultra-matte; fi
          $FF -v error -f lavfi -i testsrc2=size=360x640:rate=30 -t 1 -pix_fmt yuv420p test.mp4
          $BIN --in test.mp4 --out test_matte.mp4 --size 360

      - name: zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.zip }} ultra-matte; else zip -qry ../${{ matrix.zip }} ultra-matte; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ultra-matte-*.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ultra-matte v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ultra-matte-*.zip
